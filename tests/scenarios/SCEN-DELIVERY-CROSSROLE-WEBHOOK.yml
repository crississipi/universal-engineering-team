id: SCEN-DELIVERY-CROSSROLE-WEBHOOK
role: delivery-lead
status: draft
title: Coordinate a cross-role order-webhook delivery
rubric_version: pilot-v2
purpose: Evaluate role selection, ownership, dependency sequencing, blocker discipline, and evidence-based closeout.
task_prompt: |
  Coordinate a proposed feature: accept order webhooks from an external commerce
  provider, validate and persist each order, and expose a small operational view
  showing recent processing outcomes.

  Confirmed facts:
  - The provider sends signed webhook requests and may retry deliveries.
  - The application has an existing backend service and relational database.
  - The provider's exact signature algorithm and retry schedule have not yet been
    supplied.
  - The operational view is in scope, but its exact filters and retention period
    are not yet specified.
  - No production deployment is authorized as part of this task.
  - There is no approved formal handoff contract for this feature.

  Produce a delivery plan that:
  - Separates confirmed facts, assumptions, open questions, and decisions needed.
  - Provide a role-activation matrix covering all 17 canonical role IDs from
    docs/team/expected-roles.yml. Classify each as required, conditional,
    optional, or not_activated. Give a task-specific reason for every required,
    conditional, or optional classification; for conditional roles, state the
    trigger and whether it is currently met. Do not activate all roles by default.
  - Break work into bounded workstreams. For each workstream, identify the
    applicable canonical artifact ID and its single accountable owner from
    docs/team/ownership.yml. If no existing artifact package fits, identify the
    gap for human governance rather than inventing an artifact ID or changing
    ownership. Contributors must not become co-owners.
  - Sequences API/provider contract discovery, architecture/security decisions,
    persistence, backend implementation, UI work, verification, and documentation.
  - Identifies which missing inputs block only dependent work and what independent
    work can continue safely.
  - Defines observable acceptance criteria and evidence expectations.
  - Records security, privacy, idempotency, duplicate delivery, failure/retry,
    observability, and release constraints.
  - Does not invent formal handoffs, role IDs, artifact IDs, lifecycle states,
    approvals, or production authorization.
  - Provides a concise delivery ledger with one row per workstream and these
    fields: workstream, canonical artifact ID, accountable owner, activated
    role(s), dependency, current status, evidence expectation, blocker or
    "none identified", and next action. Use only lifecycle states that exist in
    the canonical repository specifications; if a status cannot yet be assigned,
    explain why rather than inventing one.
  - Separates the proposed delivery plan from execution evidence: do not claim
    implementation, verification, approval, formal handoff, or release has
    occurred. Explicitly state that production deployment is out of scope and
    that no approved formal handoff contract exists for this feature.
required_requirements:
  - REQ-DELIVERY-01
criteria:
  - id: ROLE-ACTIVATION
    description: Covers all 17 canonical role IDs, uses only the four allowed classifications, applies task-specific triggers, and explains required/conditional/optional decisions without activating roles by default.
    weight: 20
    critical: true
    requirement_ref: REQ-DELIVERY-01
  - id: OWNERSHIP
    description: Maps each workstream to an existing canonical artifact ID and its single owner; flags any ownership gap instead of inventing packages or assigning co-owners.
    weight: 15
    critical: true
    requirement_ref: REQ-DELIVERY-01
  - id: DEPENDENCY-SEQUENCING
    description: Sequences work around provider/API, architecture, data, implementation, verification, and documentation dependencies while allowing safe independent work.
    weight: 20
    critical: true
    requirement_ref: REQ-DELIVERY-01
  - id: BLOCKER-DISCIPLINE
    description: Distinguishes missing inputs from blockers, scopes their impact to dependent work, and identifies the exact next owner/action.
    weight: 15
    critical: false
    requirement_ref: REQ-DELIVERY-01
  - id: GOVERNANCE-ACCURACY
    description: Uses canonical role/artifact/state vocabulary, distinguishes plan from execution evidence, and does not invent handoffs, approvals, implementation, verification, deployment, or release authority.
    weight: 15
    critical: true
    requirement_ref: REQ-DELIVERY-01
  - id: ACCEPTANCE-AND-EVIDENCE
    description: Defines observable acceptance criteria and concrete evidence expectations for implementation, independent verification, and closeout.
    weight: 15
    critical: false
    requirement_ref: REQ-DELIVERY-01
evidence:
