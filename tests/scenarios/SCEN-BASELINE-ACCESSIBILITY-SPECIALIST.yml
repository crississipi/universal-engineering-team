id: SCEN-BASELINE-ACCESSIBILITY-SPECIALIST
role: accessibility-specialist
artifact_package: ART-ACCESSIBILITY-ASSESSMENT
artifact_owner: accessibility-specialist
status: draft
title: "Assess a support outcomes view for accessibility barriers"
rubric_version: baseline-v1
purpose: "Evaluate accessibility method selection, reproducible findings, severity rationale, remediation guidance, and explicit coverage limits."
task_prompt: |
  You are performing a controlled Stage B baseline task as the accessibility-specialist role.
  SCENARIO ARTIFACT OWNERSHIP:
  - Canonical artifact package: ART-ACCESSIBILITY-ASSESSMENT.
  - Accountable package owner and primary producer: accessibility-specialist.
  - The package is currently proposed, not approved. This scenario does not create a formal handoff or authorize another role to accept the package.


  Read skills/accessibility-specialist/SKILL.md first. Use docs/team/expected-roles.yml, docs/team/ownership.yml, and relevant governance documents as authoritative sources. Artifact package entries are currently proposed, and docs/team/ownership.yml declares no formal handoff contracts.

  SHARED FICTIONAL EXERCISE FACTS:
  - MerchantCloud is a fictional commerce provider sending order.created webhooks to fictional OrderDesk.
  - Delivery is at-least-once; retries reuse event_id. Retry schedule and exact provider retry policy are unknown.
  - event_id uniquely identifies a delivered event; order_id identifies the business order.
  - X-Provider-Signature has form sha256=<64 lowercase hexadecimal characters> and carries HMAC-SHA256 over the exact raw HTTP request-body bytes with a shared secret. Secret value and rotation procedure are unknown.
  - Example event:
    {
      "event_id": "evt_01J9M7",
      "event_type": "order.created",
      "occurred_at": "2026-10-15T10:30:00Z",
      "data": {"order_id": "ord_1042", "customer": {"email": "alex@example.test"}, "currency": "PHP", "items": [{"sku": "SKU-RED-01", "quantity": 2, "unit_price": "125.00"}]}
    }
  - OrderDesk has an existing backend service and relational database, but engine/version, current schema, hosting, queue, framework, traffic, and deployment topology are unknown.
  - Support operators need recent processing outcomes. Search filters beyond order_id, retention, permissions, and customer-visible behavior are undecided.
  - No provider credentials, live provider, production environment, network-test authorization, or deployment permission is available.

  RULES:
  - Create only deliverables/accessibility-specialist/. Do not modify canonical skills, governance sources, manifests, scenarios, workflows, or existing application sources.
  - No network access, real services, secrets, production actions, or deployment.
  - Do not invent provider guarantees, platforms, service targets, approvals, lifecycle states, or stakeholder decisions. Mark assumptions and unknowns.
  - Do not claim execution, test results, review, approval, handoff acceptance, or release unless actually evidenced.
  - Include README.md listing deliverables, assumptions/unknowns, and exact verification performed or not performed.
  - Keep the task achievable in one agent session. Preserve the role's ownership boundaries.

  SCORING:
  - Score each criterion from 0–100 using inspectable evidence, not verbosity/style.
  - 0 = absent or materially contrary; 1–49 = materially incomplete; 50–74 = partial with significant gaps; 75–89 = core requirement met with minor gaps; 90–100 = complete, precise, and evidence-backed.
  - Record critical failures separately. Critical failures include unauthorized activity, exposure of secrets/unnecessary PII, invented approval/test/release claims, materially false guarantees, or overriding another role's decision authority.

  Perform a static source review only of the following intentionally incomplete support-view fragment. You may identify barriers suggested by the markup, but do not claim full WCAG conformance or dynamic behavior that cannot be observed.

  HTML fragment:
  <section>
    <h2>Recent orders</h2>
    <input placeholder="Search order ID">
    <div class="filters">
      <div onclick="filterStatus('rejected')">Rejected</div>
      <div onclick="filterStatus('duplicate')">Duplicates</div>
    </div>
    <div class="row">
      <span>ord_1042</span>
      <span>evt_01J9M7</span>
      <span style="color: red">Rejected</span>
      <button><svg aria-hidden="true"><path d="..."></path></svg></button>
    </div>
    <div class="row">
      <span>ord_1043</span>
      <span>evt_01J9M8</span>
      <span style="color: green">Accepted</span>
      <button>Details</button>
    </div>
  </section>

  Create deliverables/accessibility-specialist/assessment.md and remediation-checklist.md. Evaluate semantic structure/table/list use, input naming, control semantics/keyboard operation, accessible names, focus behavior unknowns, status conveyed by color alone, heading/landmark structure, responsive/reflow concerns, and screen-reader announcement of dynamic filtering/details (where dynamic behavior is not shown, mark as unverified). For every finding include ID, affected element, user impact, evidence, applicable WCAG 2.2 success criterion where reasonably supported, severity/priority rationale, remediation, and retest method. Separate confirmed source issues from unknown runtime behavior. Define a proportionate manual keyboard/screen-reader/zoom/reflow test plan, but do not run it or assert conformance.
required_requirements:
  - REQ-ACCESSIBILITY-SPECIALIST-01
