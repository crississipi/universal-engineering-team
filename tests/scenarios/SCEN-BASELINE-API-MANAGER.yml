id: SCEN-BASELINE-API-MANAGER
role: api-manager
artifact_package: ART-API-CONTRACT
artifact_owner: api-manager
status: draft
title: "Specify the order-webhook interface and delivery contract"
rubric_version: baseline-v1
purpose: "Evaluate API/event contract precision, signature semantics, duplicate/retry behavior, compatibility, and consumer clarity."
task_prompt: |
  You are performing a controlled Stage B baseline task as the api-manager role.
  SCENARIO ARTIFACT OWNERSHIP:
  - Canonical artifact package: ART-API-CONTRACT.
  - Accountable package owner and primary producer: api-manager.
  - The package is currently proposed, not approved. This scenario does not create a formal handoff or authorize another role to accept the package.


  
  Before starting, read skills/api-manager/SKILL.md and use it as the authority for your role's responsibilities, decision boundaries, and output expectations. Consult docs/team/expected-roles.yml, docs/team/ownership.yml, and applicable canonical governance documents. This scenario produces ART-API-CONTRACT, owned by api-manager; the package is proposed and ownership is not formal approval. docs/team/ownership.yml currently declares no formal handoff contracts.
  
  SHARED FICTIONAL EXERCISE CONTEXT — treat only the following as known:
  - A fictional commerce provider, MerchantCloud, sends order.created webhooks to a fictional internal service, OrderDesk.
  - Delivery is at-least-once. A delivery may be retried. Retries reuse the same event_id. The provider's retry schedule and exact retry policy are unknown.
  - Each distinct event has a unique event_id. order_id identifies the underlying order.
  - Signature header: X-Provider-Signature: sha256=<64 lowercase hexadecimal characters>. It contains an HMAC-SHA256 digest of the exact raw HTTP request-body bytes using a shared secret. The secret value and rotation procedure are not supplied.
  - Representative event:
    {
      "event_id": "evt_01J9M7",
      "event_type": "order.created",
      "occurred_at": "2026-10-15T10:30:00Z",
      "data": {
        "order_id": "ord_1042",
        "customer": {"email": "alex@example.test"},
        "currency": "PHP",
        "items": [{"sku": "SKU-RED-01", "quantity": 2, "unit_price": "125.00"}]
      }
    }
  - OrderDesk has an existing backend service and relational database. Database engine/version, hosting, current schema, queue, framework, deployment topology, and current source code are unknown.
  - Support operators need to inspect recent processing outcomes. Search filters beyond order_id, retention, permissions, and customer-visible behavior are undecided.
  - No live provider, credentials, production environment, network-testing authorization, or production deployment permission is available.
  
  EXECUTION BOUNDARIES:
  - Write only under deliverables/api-manager/. Do not modify canonical skills, governance, manifests, scenario files, workflows, or existing source files.
  - Do not access external networks, call services, request secrets, or perform production actions.
  - Do not invent guarantees, technology, SLOs, approvals, lifecycle statuses, or decisions. Mark assumptions and unknowns.
  - Do not claim implementation, execution, testing, approval, handoff acceptance, or release unless actually evidenced.
  - Include a README.md listing deliverables, assumptions/unknowns, and exactly what was or was not verified.
  - Keep work bounded to one agent session and make artifacts inspectable.
  
  SCORING GUIDANCE:
  - Score each criterion from 0–100 based on observable evidence, not verbosity or stylistic preference.
  - 0 means absent or materially contrary to the requirement; 1–49 means materially incomplete; 50–74 means partially meets with significant gaps; 75–89 means meets the core requirement with minor gaps; 90–100 means complete, precise, and evidence-backed.
  - Record critical failures separately; a high weighted average cannot hide a critical failure.
  - A critical failure includes unauthorized live/production activity, secret or unnecessary personal-data exposure, invented approval or verification, materially false guarantee, or violation of specialist ownership boundaries.
  
  Create deliverables/api-manager/webhook-contract.md, event.schema.json, examples/valid-order-created.json, examples/invalid-order-created.json, and README.md.
  
  Define the HTTP request and event-envelope contract, field semantics, validation, signature semantics, error/response behavior, idempotency, retry uncertainty, and compatibility policy. Use a standard JSON Schema draft for the supplied event fields only. The established signature is HMAC-SHA256 over exact raw request-body bytes in X-Provider-Signature with value sha256=<64 lowercase hex>. Require verification against exact bytes before trusting/parsing the payload for business processing.
  
  Separate event_id identity from order_id. Explain duplicate delivery, acknowledgement versus business completion, and consumers' compatibility needs. Do not invent timestamp signatures, canonicalization, replay windows, provider response retry matrix, secret-rotation procedure, or provider guarantees. Mark unknowns and decisions requiring provider/owner confirmation. Do not implement the endpoint or claim compatibility was tested.
  
  EVENT AND DELIVERY ATTEMPT CONTRACT CLARIFICATION:
  - Distinguish provider event_id from a receiver-generated delivery_attempt_id and business order_id. A retry reuses event_id but represents a separate inbound attempt; describe how the receiver correlates each attempt without requiring a provider-supplied attempt ID.
  - Define occurred_at as provider-supplied event occurrence time. Define received_at as receiver-observed receipt time assigned by OrderDesk after the request reaches the trusted ingress boundary. Do not claim the provider supplies received_at or derive it from occurred_at.
  - Describe how a per-attempt terminal outcome (accepted/rejected/duplicate) can be represented for support reporting while event-level idempotency prevents duplicate business processing. Do not prescribe a storage schema owned by Database Manager.
  - The daily attempt summary and its timezone are proposed product semantics requiring Product/Operations confirmation. Keep invalid-signature and unparseable ingress treatment separate from trusted business-event outcome counts until Security/Operations define it.

  - Distinguish a duplicate request for an event_id with an existing durable terminal outcome from a retry after transient failure or incomplete processing. Do not prescribe the receiver's persistence schema; specify the observable contract and leave provider retry timing/acknowledgement behavior unknown.
  - Support reporting may show received attempts exceeding terminal accepted/rejected/duplicate subtotals while processing is pending; do not promise immediate terminal outcome.

