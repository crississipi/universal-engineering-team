id: SCEN-BASELINE-DATABASE-MANAGER
role: database-manager
artifact_package: ART-DATA-MODEL
artifact_owner: database-manager
status: draft
title: "Design the event and order data model with safe migration guidance"
rubric_version: baseline-v1
purpose: "Evaluate relational modeling, integrity constraints, indexes, idempotency representation, migration compatibility, and recovery planning."
task_prompt: |
  You are performing a controlled Stage B baseline task as the database-manager role.
  SCENARIO ARTIFACT OWNERSHIP:
  - Canonical artifact package: ART-DATA-MODEL.
  - Accountable package owner and primary producer: database-manager.
  - The package is currently proposed, not approved. This scenario does not create a formal handoff or authorize another role to accept the package.


  
  Before starting, read skills/database-manager/SKILL.md and use it as the authority for your role's responsibilities, decision boundaries, and output expectations. Consult docs/team/expected-roles.yml, docs/team/ownership.yml, and applicable canonical governance documents. This scenario produces ART-DATA-MODEL, owned by database-manager; the package is proposed and ownership is not formal approval. docs/team/ownership.yml currently declares no formal handoff contracts.
  
  SHARED FICTIONAL EXERCISE CONTEXT — treat only the following as known:
  - A fictional commerce provider, MerchantCloud, sends order.created webhooks to a fictional internal service, OrderDesk.
  - Delivery is at-least-once. A delivery may be retried. Retries reuse the same event_id. The provider's retry schedule and exact retry policy are unknown.
  - Each distinct event has a unique event_id. order_id identifies the underlying order.
  - Signature header: X-Provider-Signature: sha256=<64 lowercase hexadecimal characters>. It contains an HMAC-SHA256 digest of the exact raw HTTP request-body bytes using a shared secret. The secret value and rotation procedure are not supplied.
  - Representative event:
    {
      "event_id": "evt_01J9M7",
      "event_type": "order.created",
      "occurred_at": "2026-10-15T10:30:00Z",
      "data": {
        "order_id": "ord_1042",
        "customer": {"email": "alex@example.test"},
        "currency": "PHP",
        "items": [{"sku": "SKU-RED-01", "quantity": 2, "unit_price": "125.00"}]
      }
    }
  - OrderDesk has an existing backend service and relational database. Database engine/version, hosting, current schema, queue, framework, deployment topology, and current source code are unknown.
  - Support operators need to inspect recent processing outcomes. Search filters beyond order_id, retention, permissions, and customer-visible behavior are undecided.
  - No live provider, credentials, production environment, network-testing authorization, or production deployment permission is available.
  
  EXECUTION BOUNDARIES:
  - Write only under deliverables/database-manager/. Do not modify canonical skills, governance, manifests, scenario files, workflows, or existing source files.
  - Do not access external networks, call services, request secrets, or perform production actions.
  - Do not invent guarantees, technology, SLOs, approvals, lifecycle statuses, or decisions. Mark assumptions and unknowns.
  - Do not claim implementation, execution, testing, approval, handoff acceptance, or release unless actually evidenced.
  - Include a README.md listing deliverables, assumptions/unknowns, and exactly what was or was not verified.
  - Keep work bounded to one agent session and make artifacts inspectable.
  
  SCORING GUIDANCE:
  - Score each criterion from 0–100 based on observable evidence, not verbosity or stylistic preference.
  - 0 means absent or materially contrary to the requirement; 1–49 means materially incomplete; 50–74 means partially meets with significant gaps; 75–89 means meets the core requirement with minor gaps; 90–100 means complete, precise, and evidence-backed.
  - Record critical failures separately; a high weighted average cannot hide a critical failure.
  - A critical failure includes unauthorized live/production activity, secret or unnecessary personal-data exposure, invented approval or verification, materially false guarantee, or violation of specialist ownership boundaries.
  
  Create deliverables/database-manager/data-model.md, migration-plan.md, and schema.sql (logical SQL only; label any dialect-neutral assumptions).
  
  Propose a relational model for provider events, orders, order items, and processing outcomes. Include entity relationships, primary/foreign keys, nullability, uniqueness constraints, appropriate indexes, and retention/data-minimization implications. Explicitly distinguish event_id (unique delivery identity) from order_id (business order identity). Describe how an event claim and order/outcome persistence must be atomic, and discuss how duplicate delivery is represented without losing auditability.
  
  No database engine/version, current schema, traffic volume, migration framework, or retention policy is supplied. State which DDL details are conceptual and list evidence needed before a production migration. Provide an expand/contract migration strategy, backfill considerations, compatibility with old/new application versions, locking/rollback limits, and backup/recovery checks. Do not claim a migration ran, choose an undisclosed database dialect, or invent retention policy.
  
  DELIVERY ATTEMPT AND EVENT IDENTITY REQUIREMENTS:
  - Model provider event identity separately from receiver delivery attempts and business orders. event_id identifies one provider event; order_id identifies the business order; each inbound delivery attempt needs its own receiver-generated delivery_attempt_id.
  - Preserve each repeated delivery attempt for audit/counting while enforcing event-level idempotency so a duplicate attempt does not create a second business order. Explain transaction boundaries and uniqueness separately for event identity and attempt identity.
  - Capture receiver-observed received_at independently from provider-supplied occurred_at. Do not derive one from the other. Define both timestamp semantics and timezone storage assumptions.
  - Support the proposed daily summary of delivery attempts and their mutually exclusive terminal outcomes (accepted/rejected/duplicate). Treat the exact definition, reporting timezone, retention, and treatment of invalid-signature/unparseable ingress as decisions requiring Product/Operations/Security confirmation.
  - Distinct event_ids for the same order_id are not duplicate deliveries. Identify the domain uniqueness rule needed to decide whether a second order.created event is accepted or rejected; do not invent that rule.

  - Define event processing state separately from attempt outcome so a transient persistence failure or incomplete/nonterminal attempt is not misrepresented as a duplicate. A repeat is eligible for duplicate classification only when the event_id already has a durable terminal outcome, subject to the approved processing contract.
  - The received count may exceed the sum of accepted/rejected/duplicate while attempts remain in flight or lack a terminal outcome; preserve this distinction in the data model.

