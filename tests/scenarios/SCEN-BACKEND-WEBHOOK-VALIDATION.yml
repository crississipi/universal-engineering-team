title: Implement bounded order-webhook validation
rubric_version: pilot-v2
purpose: Evaluate whether the Backend Developer skill produces a small, correct, testable server-side implementation without expanding scope.
task_prompt: |
  Implement a small, framework-independent Python module that validates and normalizes
  incoming order webhook payloads. Treat the supplied payload as untrusted input.

  Required behavior:
  - Accept a mapping with order_id (string that is non-empty after trimming),
    customer_email, currency (exactly three uppercase ASCII letters), and items
    (non-empty list).
  - Define the basic email shape as: after trimming, exactly one "@", non-empty
    local and domain parts, no whitespace, and at least one "." in the domain.
    This is deliberately not full RFC email validation.
  - Each item must be a mapping containing sku (string non-empty after trimming),
    quantity (positive integer but not bool), and unit_price.
  - Accept unit_price only as str, int, float, or Decimal; reject bool and all
    other types. Parse through Decimal (for float input, use str(value) to avoid
    importing the binary floating-point representation). Reject blank or malformed
    decimal strings, negative values, NaN, and positive/negative infinity.
  - Reject bool values wherever numeric values are expected.
  - Return a normalized structure with trimmed order_id and sku, trimmed and
    lowercased email, uppercase currency, and finite non-negative Decimal unit
    prices. Do not quantize or round prices.
  - Do not perform network calls, database writes, logging, authentication, or
    persistence. Do not invent fields or silently coerce malformed values.
  - Include focused tests for valid input; missing order and item fields; malformed
    email under the stated rule; non-mapping items; bool quantity and bool price;
    zero/negative quantity; negative, malformed, and non-finite prices; unsupported
    price types; malformed currency; and empty items.
  - Explain any deliberate validation boundary and provide exact test command/output
    only if actually run.

  Use only the Python standard library. Keep the implementation small and typed.
required_requirements:
  - REQ-BACKEND-01
criteria:
  - id: SCOPE-CONTROL
    description: Implements only the requested pure validation/normalization behavior and avoids network, persistence, logging, authentication, or unrelated abstractions.
    weight: 15
    critical: true
    requirement_ref: REQ-BACKEND-01
  - id: INPUT-VALIDATION
    description: Validates required fields and item mappings; trims and rejects blank identifiers; applies the exact basic email rule in the prompt; validates uppercase ASCII currency; and rejects malformed item collections without silent coercion.
    weight: 20
    critical: true
    requirement_ref: REQ-BACKEND-01
  - id: NUMERIC-SAFETY
    description: Accepts only the specified unit_price types, rejects booleans and unsupported types, parses finite non-negative Decimal values without rounding, and rejects non-positive quantities.
    weight: 20
    critical: true
    requirement_ref: REQ-BACKEND-01
  - id: NORMALIZATION
    description: Applies the specified trimming and case normalization consistently while preserving valid business values.
    weight: 10
    critical: false
    requirement_ref: REQ-BACKEND-01
  - id: TEST-COVERAGE
    description: Supplies focused positive, negative, and boundary tests for every enumerated validation requirement.
    weight: 20
    critical: true
    requirement_ref: REQ-BACKEND-01
  - id: EVIDENCE-AND-ACCURACY
    description: Clearly separates implemented behavior from unrun checks and reports commands/results without fabricating execution.
    weight: 15
    critical: false
    requirement_ref: REQ-BACKEND-01
