id: SCEN-BASELINE-FRONTEND-DEVELOPER
role: frontend-developer
artifact_package: ART-FRONTEND
artifact_owner: frontend-developer
status: draft
title: "Build a support-facing order-processing outcomes view"
rubric_version: baseline-v1
purpose: "Evaluate client-side UI implementation, filtering and details interactions, state coverage, safe data handling, and responsive behavior."
task_prompt: |
  You are performing a controlled Stage B baseline task as the frontend-developer role.
  SCENARIO ARTIFACT OWNERSHIP:
  - Canonical artifact package: ART-FRONTEND.
  - Accountable package owner and primary producer: frontend-developer.
  - The package is currently proposed, not approved. This scenario does not create a formal handoff or authorize another role to accept the package.



  Before starting, read skills/frontend-developer/SKILL.md and use it as the authority for your role's responsibilities, decision boundaries, and output expectations. Consult docs/team/expected-roles.yml, docs/team/ownership.yml, and applicable canonical governance documents. This scenario produces ART-FRONTEND, owned by frontend-developer; the package is proposed and ownership is not formal approval. docs/team/ownership.yml currently declares no formal handoff contracts.

  SHARED FICTIONAL EXERCISE CONTEXT — treat only the following as known:
  - A fictional commerce provider, MerchantCloud, sends order.created webhooks to a fictional internal service, OrderDesk.
  - Delivery is at-least-once. A delivery may be retried. Retries reuse the same event_id. The provider's retry schedule and exact retry policy are unknown.
  - Each distinct event has a unique event_id. order_id identifies the underlying order.
  - Signature header: X-Provider-Signature: sha256=<64 lowercase hexadecimal characters>. It contains an HMAC-SHA256 digest of the exact raw HTTP request-body bytes using a shared secret. The secret value and rotation procedure are not supplied.
  - Representative event:
    {
      "event_id": "evt_01J9M7",
      "event_type": "order.created",
      "occurred_at": "2026-10-15T10:30:00Z",
      "data": {
        "order_id": "ord_1042",
        "customer": {"email": "alex@example.test"},
        "currency": "PHP",
        "items": [{"sku": "SKU-RED-01", "quantity": 2, "unit_price": "125.00"}]
      }
    }
  - OrderDesk has an existing backend service and relational database. Database engine/version, hosting, current schema, queue, framework, deployment topology, and current source code are unknown.
  - Support operators need to inspect recent processing outcomes. Search filters beyond order_id, retention, permissions, and customer-visible behavior are undecided.
  - No live provider, credentials, production environment, network-testing authorization, or production deployment permission is available.

  EXECUTION BOUNDARIES:
  - Write only under deliverables/frontend-developer/. Do not modify canonical skills, governance, manifests, scenario files, workflows, or existing source files.
  - Do not access external networks, call services, request secrets, or perform production actions.
  - Do not invent guarantees, technology, SLOs, approvals, lifecycle statuses, or decisions. Mark assumptions and unknowns.
  - Do not claim implementation, execution, testing, approval, handoff acceptance, or release unless actually evidenced.
  - Include a README.md listing deliverables, assumptions/unknowns, and exactly what was or was not verified.
  - Keep work bounded to one agent session and make artifacts inspectable.

  SCORING GUIDANCE:
  - Score each criterion from 0–100 based on observable evidence, not verbosity or stylistic preference.
  - 0 means absent or materially contrary to the requirement; 1–49 means materially incomplete; 50–74 means partially meets with significant gaps; 75–89 means meets the core requirement with minor gaps; 90–100 means complete, precise, and evidence-backed.
  - Record critical failures separately; a high weighted average cannot hide a critical failure.
  - A critical failure includes unauthorized live/production activity, secret or unnecessary personal-data exposure, invented approval or verification, materially false guarantee, or violation of specialist ownership boundaries.

  Build a dependency-free browser UI with local fixtures only. Create deliverables/frontend-developer/index.html, styles.css, orders.js, and README.md.

  Show recent processing outcomes with order_id, event_id, received time, status (accepted/rejected/duplicate), and safe failure reason when available. Include filters by order_id and status, a selected-row detail view, and distinct loading, empty, no-match, error, and populated states that can be demonstrated without a server. Supply at least five fixtures covering all statuses, long failure reason, and multiple events for one order. Render untrusted values as text, not HTML. Use semantic controls/table/list, keyboard-operable interactions, responsive desktop/narrow-screen behavior, and clearly indicate that the page is using local demonstration fixtures. Do not add a backend, real API requests, authentication, invented support permissions, or customer-facing features. Include a manual interaction checklist; do not claim browser tests ran unless they actually ran.

  DAILY SUMMARY AND TIMESTAMP REQUIREMENTS:
  - In addition to recent outcomes, implement a local-fixture demonstration of the first-release support-facing daily operational summary requested by Operations: received, accepted, rejected, and duplicate delivery-attempt counts. Do not imply customer-facing access.
  - Distinguish provider event occurrence time (occurred_at) from receiver-observed receipt time (received_at). Show separate, explicit labels; never derive received_at from occurred_at. Fixture receipt times must be clearly marked as synthetic demonstration values.
  - Treat each row as a delivery attempt with its own delivery_attempt_id where available; show event_id as the provider event identity and order_id as the business order identity. Multiple attempts may share event_id; multiple distinct event_ids may refer to one order_id.
  - The daily summary is a proposal based on receiver receipt date. Label the timezone/date basis as illustrative pending Product/Operations confirmation; do not invent an approved reporting timezone.
  - Show loading, empty, no-match, and error states for both the outcomes list and summary. Keep the summary accessible and usable on narrow screens. Do not invent permission rules or expose raw payloads/PII.

  - Do not label an event "delayed" based on an invented time threshold. Use neutral "not yet visible" or "no matching outcome yet" copy; if a threshold is later approved, it must be supplied as configuration/contract input, not hard-coded as a fabricated SLA.

  - The received total includes eligible attempts still processing; accepted/rejected/duplicate are terminal-outcome subtotals and may sum to less than received. Explain this in accessible summary text rather than implying a data error.
  - Only display a repeat attempt as duplicate when the same event_id already has a durable terminal event outcome; a transient or nonterminal failure is not a duplicate.

